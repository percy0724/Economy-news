name: 뉴스 자동 업데이트

on:
  schedule:
    # 매시간 정각에 실행 (UTC 기준). 한국시간과는 9시간 차이가 있어요.
    - cron: "0 * * * *"
  workflow_dispatch:
    # 이 줄 덕분에 Actions 탭에서 "Run workflow" 버튼으로 수동 실행도 가능해요.

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 뉴스 가져오는 스크립트 실행
        env:
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}
        run: python fetch_news.py

      - name: 변경된 index.html 커밋 및 푸시
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "자동 뉴스 업데이트"
          git pull --rebase origin main
          git push
